version: '3.8'

services:
  # Сервис orders-service-1
  orders-service-1:
    build: ./service-1
    image: orders-service-1
    ports:
      - "8001:8001"
    depends_on:
      postgres-orders-service-1:
        condition: service_healthy
      jaeger:
        condition: service_started
      kafka:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-orders-service-1:5432/orders-service-1-db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: password
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
      MANAGEMENT_METRICS_EXPORT_OTLP_ENABLED: "false"
      OTEL_METRICS_EXPORTER: none
      OTEL_SERVICE_NAME: orders-service-1
    working_dir: /app
    networks:
      - app-network

  # Сервис products-service-2
  products-service-2:
    build: ./service-2
    image: products-service-2
    ports:
      - "8002:8002"
    depends_on:
      postgres-products-service-2:
        condition: service_healthy
      jaeger:
        condition: service_started
      kafka:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-products-service-2:5432/products-service-2-db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: password
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
      MANAGEMENT_METRICS_EXPORT_OTLP_ENABLED: "false"
      OTEL_METRICS_EXPORTER: none
      OTEL_SERVICE_NAME: products-service-2
    working_dir: /app
    networks:
      - app-network

  # База данных сервиса orders-service-1
  postgres-orders-service-1:
    image: postgres:14
    ports:
      - "15432:15432"
    environment:
      POSTGRES_DB: orders-service-1-db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_HOST_AUTH_METHOD: trust
    volumes:
      - postgres_orders_service_1_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app-network

  # База данных сервиса products-service-2
  postgres-products-service-2:
    image: postgres:14
    ports:
      - "25432:25432"
    environment:
      POSTGRES_DB: products-service-2-db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_HOST_AUTH_METHOD: trust
    volumes:
      - postgres_products_service_2_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app-network

  # UI для обеих баз данных (postgres-orders-service-1 и postgres-products-service-2)
  pgadmin:
    image: dpage/pgadmin4:latest
    ports:
      - "5050:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_LISTEN_PORT: 80
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    networks:
      - app-network

  kafka:
    image: confluentinc/cp-kafka:7.3.1
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
    depends_on:
      - zookeeper
    healthcheck:
      test: [ "CMD", "kafka-topics", "--bootstrap-server", "kafka:9092", "--list" ]
      interval: 30s
      timeout: 30s
      retries: 5
    networks:
      - app-network

  zookeeper:
    image: confluentinc/cp-zookeeper:7.3.1
    ports:
      - "2181:2181"
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - app-network

  schema-registry:
    image: confluentinc/cp-schema-registry:7.3.1
    ports:
      - "8081:8081"
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: kafka:9092
      SCHEMA_REGISTRY_LISTENERS: http://0.0.0.0:8081
    depends_on:
      - kafka
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8081/subjects" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app-network

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    depends_on:
      - kafka
      - schema-registry
    networks:
      - app-network

  # UI Jaeger для сбора трейсов с сервисов orders-service-1 и products-service-2
  jaeger:
    image: jaegertracing/all-in-one:latest
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
      COLLECTOR_OTLP_HTTP_PORT: "4318"
    ports:
      - '16686:16686'  # UI
      - '4318:4318'    # OTLP HTTP
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:16686/health" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  postgres_orders_service_1_data:
  postgres_products_service_2_data:
  pgadmin_data: